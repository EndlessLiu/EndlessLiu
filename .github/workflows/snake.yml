name: Generate GitHub Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=blue

      - name: Move generated files
        run: |
          mkdir -p profile
          cp dist/github-snake.svg profile/github-snake.svg
          cp dist/github-snake-dark.svg profile/github-snake-dark.svg

      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-snake.svg profile/github-snake-dark.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub contribution snake"
          git push
