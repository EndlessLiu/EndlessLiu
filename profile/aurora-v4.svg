<text x="42" y="650" font-family="monospace" font-size="10" letter-spacing="1.8" fill="#334155">DARK / NEON / GLASS / MOTION / ANIME / PERSONAL COMPUTING</text>
<text x="1320" y="650" font-family="monospace" font-size="10" fill="#334155">v4.0</text>
</svg>