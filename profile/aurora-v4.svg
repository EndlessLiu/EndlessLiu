<rect x="1050" y="115" width="280" height="350" rx="28" fill="url(#cyan)" opacity=".10"/>
<rect x="1068" y="134" width="98" height="28" rx="8" fill="#020711" fill-opacity=".72" stroke="#164E63"/>
<text x="1084" y="153" font-family="monospace" font-size="10" fill="#A5F3FC">OWNER</text>
<rect x="1200" y="431" width="108" height="27" rx="8" fill="#020711" fill-opacity=".72" stroke="#3730A3"/>
<circle cx="1215" cy="444.5" r="4" fill="#34D399" filter="url(#glow)"/>
<text x="1227" y="449" font-family="monospace" font-size="9" fill="#D1FAE5">ACTIVE</text>

<rect x="930" y="382" width="214" height="172" rx="24" fill="#050A14" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2"/>
<image href="https://raw.githubusercontent.com/EndlessLiu/EndlessLiu/main/216.jpg" x="930" y="382" width="214" height="172" preserveAspectRatio="xMidYMid slice" clip-path="url(#a2)"/>
<rect x="945" y="397" width="98" height="27" rx="8" fill="#020711" fill-opacity=".72"/>
<text x="961" y="416" font-family="monospace" font-size="9" fill="#A5F3FC">ARCHIVE 01</text>

<rect x="1165" y="438" width="195" height="160" rx="24" fill="#050A14" stroke="#C084FC" stroke-opacity=".55" stroke-width="2"/>
<image href="https://raw.githubusercontent.com/EndlessLiu/EndlessLiu/main/222.jpg" x="1165" y="438" width="195" height="160" preserveAspectRatio="xMidYMid slice" clip-path="url(#a3)"/>
<rect x="1180" y="453" width="95" height="27" rx="8" fill="#020711" fill-opacity=".72"/>
