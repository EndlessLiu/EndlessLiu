<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="600" viewBox="0 0 1400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01050B"/>
      <stop offset="0.42" stop-color="#03101A"/>
      <stop offset="0.72" stop-color="#020814"/>
      <stop offset="1" stop-color="#01040A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1400" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#3B82F6" stop-opacity=".58"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
