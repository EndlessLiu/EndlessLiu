<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="600" viewBox="0 0 1440 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="600" gradientUnits="userSpaceOnUse">
    <stop stop-color="#03050B"/><stop offset=".48" stop-color="#071225"/><stop offset="1" stop-color="#11071B"/>
  </linearGradient>
  <linearGradient id="line" x1="30" y1="30" x2="1410" y2="570" gradientUnits="userSpaceOnUse">
    <stop stop-color="#67E8F9"/><stop offset=".44" stop-color="#60A5FA"/><stop offset="1" stop-color="#D8B4FE"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".28" stop-color="#22D3EE" stop-opacity=".85"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".8"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="cyanGlow"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#A855F7" stop-opacity=".18"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#93C5FD" stroke-opacity=".055"/></pattern>
  <pattern id="micro" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r=".65" fill="#C4B5FD" fill-opacity=".13"/></pattern>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="avatarClip"><circle cx="1183" cy="282" r="115"/></clipPath>
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .float { animation: float 5s ease-in-out infinite; }
    .spin { animation: spin 18s linear infinite; transform-origin: 1183px 282px; }
    .scan { animation: scan 4.5s ease-in-out infinite; }
    .blink { animation: blink 1.6s steps(2,end) infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes scan { 0%{transform:translateX(-180px);opacity:0} 18%{opacity:.9} 70%{opacity:.9} 100%{transform:translateX(1600px);opacity:0} }
    @keyframes blink { 50%{opacity:.35} }
  </style>
</defs>

<rect width="1440" height="600" rx="32" fill="url(#bg)"/>
<ellipse cx="250" cy="250" rx="300" ry="240" fill="url(#cyanGlow)" filter="url(#soft)"/>
<ellipse cx="1200" cy="300" rx="310" ry="260" fill="url(#violetGlow)" filter="url(#soft)"/>
<rect width="1440" height="600" rx="32" fill="url(#grid)"/>
